name: Feature or university request
description: Suggest an improvement, or another university or platform to support.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: For a new university, say which one and which learning platform it uses (Canvas, Brightspace, Moodle, ...).
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it matter?
